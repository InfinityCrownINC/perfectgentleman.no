<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Perfect Gentleman</title>
    
    <!-- This tag handles the automatic redirect -->
    <!-- "content=5" means it will wait 5 seconds before redirecting -->
    <meta http-equiv="refresh" content="10;url=https://perfectgentleman.no/">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #fcfcfc;
            color: #333333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            color: #1a1a1a;
        }
        h2 {
            font-size: 1.5rem;
            margin: 10px 0 20px;
            font-weight: normal;
        }
        p {
            font-size: 1rem;
            color: #555555;
            margin-bottom: 20px;
        }
        a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #1a1a1a;
            color: #ffffff;
            text-decoration: none;
            border-radius: 4px;
            transition: background-color 0.3s ease;
        }
        a:hover {
            background-color: #444444;
        }
    </style>
</head>
<body>

    <h1>404</h1>
    <h2>Ka du holde på med?</h2>
    <p>You will be redirected to the homepage in 10 seconds...</p>
    
    <!-- Fallback link in case the automatic redirect doesn't trigger -->
    <a href="https://perfectgentleman.no/">Return to Homepage</a>

</body>
</html>
